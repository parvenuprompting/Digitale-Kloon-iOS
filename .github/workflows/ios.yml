name: Digitale Kloon Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Prepare iOS simulator
        shell: bash
        run: |
          set -euo pipefail

          runtime_id=$(xcrun simctl list runtimes | sed -n 's/.* - \(com.apple.CoreSimulator.SimRuntime.iOS[^ ]*\).*/\1/p' | tail -n 1)
          if [[ -z "$runtime_id" ]]; then
            xcodebuild -downloadPlatform iOS
            runtime_id=$(xcrun simctl list runtimes | sed -n 's/.* - \(com.apple.CoreSimulator.SimRuntime.iOS[^ ]*\).*/\1/p' | tail -n 1)
          fi

          device_type_id=$(xcrun simctl list devicetypes | sed -n 's/.*iPhone 16[^ (]* *(\([^)]*\)).*/\1/p' | head -n 1)
          if [[ -z "$device_type_id" ]]; then
            device_type_id=$(xcrun simctl list devicetypes | sed -n 's/.*iPhone[^ (]* *(\([^)]*\)).*/\1/p' | head -n 1)
          fi

          [[ -n "$runtime_id" ]] || { echo "No iOS Simulator runtime available" >&2; exit 1; }
          [[ -n "$device_type_id" ]] || { echo "No iPhone Simulator device type available" >&2; exit 1; }

          simulator_id=$(xcrun simctl create "DigitaleKloon CI" "$device_type_id" "$runtime_id")
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Build and test
        run: xcodebuild -project DigitaleKloon.xcodeproj -scheme DigitaleKloon -destination "id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO test
      - name: Build app
        run: xcodebuild -project DigitaleKloon.xcodeproj -scheme DigitaleKloon -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Remove CI simulator
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIMULATOR_ID:-}" ]]; then
            xcrun simctl delete "$SIMULATOR_ID" || true
          fi
